<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stake Calculator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0f172a;
color:white;

}

header{

background:#111827;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
color:#22c55e;
box-shadow:0 2px 10px rgba(0,0,0,.4);

}

.container{

max-width:600px;
margin:auto;
padding:15px;

}

.card{

background:#1e293b;
padding:18px;
border-radius:12px;
margin-bottom:18px;

}

.card h2{

margin-bottom:15px;
color:#22c55e;

}

label{

display:block;
margin-top:12px;
margin-bottom:6px;
font-size:14px;

}

input{

width:100%;
padding:14px;
border:none;
outline:none;
border-radius:8px;
font-size:18px;
background:#334155;
color:white;

}

button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;

}

button:hover{

opacity:.9;

}

table{

width:100%;
margin-top:15px;
border-collapse:collapse;

}

table th{

background:#0f172a;
padding:10px;

}

table td{

padding:10px;
text-align:center;
border-bottom:1px solid #334155;

}

.result{

text-align:center;
font-size:22px;
margin-top:15px;
line-height:1.8;

}

.green{

color:#22c55e;
font-weight:bold;

}

nav{

position:fixed;
bottom:0;
left:0;
right:0;

display:flex;
background:#111827;

}

nav button{

margin:0;
border-radius:0;
background:#111827;
color:white;
padding:18px;

}

.active{

background:#22c55e !important;

}

.page{

display:none;

padding-bottom:90px;

}

.show{

display:block;

}

.small{

font-size:13px;
color:#94a3b8;

}

</style>

</head>

<body>

<header>

Stake Calculator

</header>

<div class="container">

<div id="setupPage" class="page show">

<div class="card">

<h2>Setup</h2>

<label>Your Bank Size</label>

<input
type="number"
id="bank"
placeholder="50000">

<button id="saveBank">

Save Bank

</button>

</div>

<div class="card">

<h2>Stake Strategy</h2>

<p class="small">

Add the stake amount and its percentage.

</p>

<label>Stake Amount</label>

<input
type="number"
id="stakeAmount"
placeholder="3500">

<label>Percentage</label>

<input
type="number"
id="stakePercent"
placeholder="7">

<button id="addStrategy">

Add Strategy

</button>

<table>

<thead>

<tr>

<th>Stake</th>

<th>%</th>

<th>Delete</th>

</tr>

</thead>

<tbody id="strategyTable">

</tbody>

</table>

</div>

</div>

<div id="calculatorPage" class="page">

<div class="card">

<h2>Calculator</h2>

<label>Paste ProTipster Stake</label>

<input
type="number"
id="tipStake"
placeholder="3500">

<button id="calculate">

Calculate

</button>

<div class="result">

<div>

Percentage:

<span id="percentResult" class="green">

-

</span>

</div>

<div>

Your Stake:

<span id="stakeResult" class="green">

-

</span>

</div>

</div>

</div>

</div>

</div>

<nav>

<button
id="setupBtn"
class="active">

Setup

</button>

<button
id="calcBtn">

Calculator

</button>

</nav>

<script>

// JavaScript starts here.
// We'll build all the functionality in Part 2.

</script>

</body>
</html>
